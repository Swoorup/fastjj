name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 30
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
      # Complete every platform check even if one runner finds a regression.
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: vendor/jjui/go.sum
      - name: Test private jjui integration
        working-directory: vendor/jjui
        run: go test ./...
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --no-deps -- -D warnings
      - run: cargo test --locked -- --nocapture
      - name: Build fastjjui
        working-directory: vendor/jjui
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w -X main.Version=fastjjui-0.2.0-jjui-0.10.11' -o ../../target/debug/fastjjui ./cmd/jjui
      - name: Verify native HTTPS transport and certificate trust
        run: python3 scripts/verify_https_clone.py target/debug/fastjj
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y strace openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Verify native SSH authentication, configuration, tunnels, and privacy
        run: python3 scripts/verify_ssh.py target/debug/fastjj --ui-binary target/debug/fastjjui
      - name: Verify real jjui workflows and private process arguments
        run: python3 scripts/verify_jjui.py target/debug/fastjj target/debug/fastjjui
      - if: runner.os == 'Linux'
        run: python3 scripts/verify_process_privacy.py target/debug/fastjj

  nix:
    name: Nix binary (${{ matrix.runner }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: cachix/install-nix-action@v31
      - name: Check formatting and evaluate every platform
        run: |
          nix fmt -- --check flake.nix nix/package.nix
          nix flake check --all-systems --no-build
      - name: Download and install the native release binary
        run: |
          binary="$(nix build .#fastjj --no-link --print-out-paths --print-build-logs)/bin/fastjj"
          echo "FASTJJ_BINARY=$binary" >> "$GITHUB_ENV"
          nix run . -- --version
          nix run . -- privacy
      - name: Verify HTTPS with the installed Nix package
        run: python3 scripts/verify_https_clone.py "$FASTJJ_BINARY"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y strace openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Verify SSH and privacy with the installed Nix package
        run: python3 scripts/verify_ssh.py "$FASTJJ_BINARY"
      - if: runner.os == 'Linux'
        run: python3 scripts/verify_process_privacy.py "$FASTJJ_BINARY"
