name: Release binaries
on:
  push:
    branches: [main]
    tags: ['v*']
    # Pinning an already verified release does not change either executable.
    # These changes still run source and installed-package checks in CI.
    paths-ignore:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      SOURCE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: vendor/jjui/go.sum
      - name: Test private jjui integration
        working-directory: vendor/jjui
        run: go test ./...
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          test "$host" = "$TARGET"
      - name: Test optimized binary and kernel privacy
        run: cargo test --release --locked --target "$TARGET" -- --nocapture
      - name: Verify jj config discovery and commit identity
        run: python3 scripts/verify_config.py "target/$TARGET/release/fjj"
      - name: Build fjjui
        working-directory: vendor/jjui
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w -X main.Version=fjjui-0.2.4-jjui-0.10.11' -o "../../target/$TARGET/release/fjjui" ./cmd/jjui
      - name: Verify native HTTPS transport and certificate trust
        run: python3 scripts/verify_https_clone.py "target/$TARGET/release/fjj"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y strace openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Verify native SSH authentication, configuration, tunnels, and privacy
        run: python3 scripts/verify_ssh.py "target/$TARGET/release/fjj" --ui-binary "target/$TARGET/release/fjjui" --lua-prompts --external-editor
      - name: Verify real jjui workflows and private process arguments
        run: python3 scripts/verify_jjui.py "target/$TARGET/release/fjj" "target/$TARGET/release/fjjui"
      - name: Verify external editors and private process arguments
        run: python3 scripts/verify_editor.py "target/$TARGET/release/fjj" --ui-binary "target/$TARGET/release/fjjui"
      - if: runner.os == 'Linux'
        run: python3 scripts/verify_embed.py "target/$TARGET/release/fjj"
      - name: Test release packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Package binary, license, documentation, and checksums
        shell: bash
        run: |
          set -euo pipefail
          # Keep the array nonempty: macOS Bash 3 treats an empty array as
          # unbound under set -u, even when it was explicitly initialized.
          package_args=(--binary "target/$TARGET/release/fjj"
                        --target "$TARGET" --commit "$SOURCE_COMMIT")
          if [[ -n "$RELEASE_TAG" ]]; then
            package_args+=(--tag "$RELEASE_TAG")
          fi
          python3 scripts/package_release.py "${package_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: fjj-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fjj-*
          merge-multiple: true
          path: dist
      - name: Publish versioned GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check ./*.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Nix pins these assets by hash. Never replace a published binary.
            gh release download "$RELEASE_TAG" --dir published
            for asset in ./*.tar.gz ./*.sha256; do
              if ! cmp "$asset" "published/${asset#./}"; then
                echo "Published assets differ; create a new version instead of overwriting $RELEASE_TAG." >&2
                exit 1
              fi
            done
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz ./*.sha256 \
              --verify-tag --title "fjj $RELEASE_TAG" --generate-notes
          fi
