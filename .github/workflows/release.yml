name: Release binaries
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      SOURCE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true
      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          test "$host" = "$TARGET"
      - name: Test optimized binary and kernel privacy
        run: cargo test --release --locked --target "$TARGET" -- --nocapture
      - name: Verify native HTTPS transport and certificate trust
        run: python3 scripts/verify_https_clone.py "target/$TARGET/release/fastjj"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace
      - if: runner.os == 'Linux'
        run: python3 scripts/verify_process_privacy.py "target/$TARGET/release/fastjj"
      - name: Test release packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Package binary, license, documentation, and checksums
        shell: bash
        run: |
          set -euo pipefail
          # Keep the array nonempty: macOS Bash 3 treats an empty array as
          # unbound under set -u, even when it was explicitly initialized.
          package_args=(--binary "target/$TARGET/release/fastjj"
                        --target "$TARGET" --commit "$SOURCE_COMMIT")
          if [[ -n "$RELEASE_TAG" ]]; then
            package_args+=(--tag "$RELEASE_TAG")
          fi
          python3 scripts/package_release.py "${package_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: fastjj-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fastjj-*
          merge-multiple: true
          path: dist
      - name: Publish versioned GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check ./*.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tar.gz ./*.sha256 \
              --verify-tag --title "fastjj $RELEASE_TAG" --generate-notes
          fi
