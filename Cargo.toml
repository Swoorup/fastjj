[package]
name = "fastjj"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A process-private Jujutsu client with in-process Git transport"
license = "Apache-2.0"
repository = "https://github.com/Swoorup/fastjj"

[dependencies]
jj-cli = { version = "=0.29.0", default-features = false, features = ["git2", "vendored-openssl"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
strip = "debuginfo"

[patch.crates-io]
jj-cli = { path = "vendor/jj-cli" }
