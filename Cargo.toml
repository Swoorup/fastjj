[package]
name = "fastjj"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A process-private Jujutsu client with in-process Git transport"
license = "Apache-2.0"
repository = "https://github.com/Swoorup/fastjj"

[dependencies]
base64 = "0.22"
git2 = { version = "0.20.4", features = ["vendored-libgit2", "vendored-openssl"] }
glob = "0.3"
jj-cli = { version = "=0.29.0", default-features = false, features = ["git2", "vendored-openssl"] }
libc = "0.2"
percent-encoding = "2"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
ssh-key = { version = "0.6.7", default-features = false, features = ["ecdsa", "std"] }
ssh2 = "0.9.6"
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
strip = "debuginfo"

[patch.crates-io]
jj-cli = { path = "vendor/jj-cli" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
